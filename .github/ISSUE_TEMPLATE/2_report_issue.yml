name: 🐞 Issue report
description: Report an issue in Niaromi
labels: [bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide an example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you should expect to happen.
      placeholder: |
        Example:
          "This should happen..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happens.
      placeholder: |
        Example:
          "This happened instead..."
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Crash logs
      description: |
        If experiencing crashes, go to **Settings → Advanced → Dump crash logs** and share the logs here.
      placeholder: |
        Paste crash logs or attach a file.

  - type: input
    id: app-version
    attributes:
      label: Niaromi version
      description: You can find your version in **Settings → About**.
      placeholder: |
        Example: "1.0.0"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: You can find this in your Android settings.
      placeholder: |
        Example: "Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: List your device and model.
      placeholder: |
        Example: "Google Pixel 8"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully before submitting.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I have filled out all of the requested information in this form.
          required: true
