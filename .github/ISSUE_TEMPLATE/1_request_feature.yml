name: ⭐ Feature request
description: Suggest a feature to improve Niaromi
labels: [feature request]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Describe your suggested feature
      description: How can Niaromi be improved?
      placeholder: |
        Example:
          "It should work like this..."
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully before submitting.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I have verified this request is for Niaromi.
          required: true
        - label: I will fill out all of the requested information in this form.
          required: true
